    <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="350" y="25" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280">~/stockship — deploy</text>
    <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><text x="24" y="76" class="tl t0"><tspan fill="#6b7280">$ </tspan><tspan fill="#e5e7eb">git push origin main</tspan></text><text x="24" y="101" class="tl t1"><tspan fill="#10D59A">✓ </tspan><tspan fill="#a9b3c9">lint &amp; tests passed</tspan></text><text x="24" y="126" class="tl t2"><tspan fill="#10D59A">✓ </tspan><tspan fill="#a9b3c9">nest build · api ready</tspan></text><text x="24" y="151" class="tl t3"><tspan fill="#10D59A">✓ </tspan><tspan fill="#a9b3c9">prisma migrate deploy</tspan></text><text x="24" y="176" class="tl t4"><tspan fill="#10D59A">✓ </tspan><tspan fill="#a9b3c9">next build · admin dashboard</tspan></text><text x="24" y="201" class="tl t5"><tspan fill="#818CF8">→ </tspan><tspan fill="#e5e7eb">shipped to production 🚀</tspan></text></g>
    <rect class="cur" x="24" y="212" width="9" height="17" fill="#10D59A"/>
  </g></g>

  <text class="up" style="animation-delay:.15s" x="72" y="104" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#10D59A">// hello world, I'm</text>
  <text class="up" style="animation-delay:.4s" x="68" y="178" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#f4f7fb" letter-spacing="-1.5">Ahmed Raouf</text>
  <rect class="bar" x="72" y="198" width="200" height="6" rx="3" fill="url(#ac)"/>
  <text class="up" style="animation-delay:.7s" x="72" y="250" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#d7dcf0"><tspan fill="#A9A3FF">Technical Team Lead</tspan> <tspan fill="#6b7280">·</tspan> Full-stack</text>
  <g class="up" style="animation-delay:1s" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15.5"><rect x="72" y="290" width="236" height="36" rx="18" fill="#7F75E8" fill-opacity="0.2" stroke="#7F75E8" stroke-opacity="0.7"/><text x="190.0" y="313" text-anchor="middle" fill="#e6e3ff" font-weight="600">🧭  Team Lead @ QeemaTech</text><rect x="320" y="290" width="206" height="36" rx="18" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/><text x="423.0" y="313" text-anchor="middle" fill="#aab3c8" font-weight="400">⚡  4+ yrs in production</text><rect x="538" y="290" width="146" height="36" rx="18" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/><text x="611.0" y="313" text-anchor="middle" fill="#aab3c8" font-weight="400">📍  Cairo, Egypt</text></g>

  <path d="M14,40 V14 H40 M1160,14 H1186 V40 M1186,340 V366 H1160 M40,366 H14 V340" fill="none" stroke="#10D59A" stroke-width="2" stroke-opacity=".55" stroke-linecap="round"/>
  <rect class="scan" x="0" y="0" width="1200" height="70" fill="url(#scan)" style="animation-name:scan380"/>
  <style>.scan { animation: scan380 8s linear infinite; } @keyframes scan380 { from { transform: translateY(-80px); } to { transform: translateY(390px); } }</style>
</g>
</svg>