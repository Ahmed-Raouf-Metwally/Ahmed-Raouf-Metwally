# Refreshes assets/stats.svg and assets/coding.svg (WakaTime) once a day. Add a STATS_TOKEN secret to include private repos;
# without it the card counts public repos only.
name: Refresh GitHub stats

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/stats.py
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python scripts/waka.py
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/coding.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats card"
          git push
